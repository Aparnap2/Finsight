  - variance
  - core
  source: formula_engine
  sox_relevant: true
- formula_id: budget_utilization_rate
  name: Budget Utilization Rate
  description: Percentage of budget that has been spent or consumed.
  expression: (SpentAmount / BudgetAmount) * 100
  depends_on: []
