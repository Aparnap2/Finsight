  - number_of_hires
  data_type: Money
  category: Expense
  owner: FP&A Team
  version: 1.0.0
  valid_from: '2026-01-01'
  tags:
  - hr
  - recruiting
  - efficiency
  source: kpi_engine
  sox_relevant: false
- formula_id: working_capital
  name: Working Capital
  description: Measure of short-term liquidity and operational efficiency.
  expression: CurrentAssets - CurrentLiabilities
  depends_on:
  - current_assets
  - current_liabilities
  data_type: Money
  category: BalanceSheet
  owner: Controller
  version: 1.0.0
  valid_from: '2026-01-01'
  tags:
  - gaap
  - liquidity
  - core
  source: formula_engine
  sox_relevant: true
- formula_id: current_ratio
  name: Current Ratio
  description: Measure of ability to pay short-term obligations with short-term assets.
  expression: CurrentAssets / CurrentLiabilities
  depends_on:
  - current_assets
  - current_liabilities
  data_type: Ratio
  category: Liquidity
  owner: Treasury
  version: 1.0.0
  valid_from: '2026-01-01'
  tags:
  - gaap
  - liquidity
  - health
  source: formula_engine
  sox_relevant: true
- formula_id: quick_ratio
  name: Quick Ratio (Acid-Test)
  description: Measure of ability to pay short-term obligations with most liquid assets.
  expression: (CurrentAssets - Inventory) / CurrentLiabilities
  depends_on:
  - current_assets
  - inventory
  - current_liabilities
  data_type: Ratio
  category: Liquidity
  owner: Treasury
  version: 1.0.0
  valid_from: '2026-01-01'
  tags:
  - gaap
  - liquidity
  - health
  source: formula_engine
  sox_relevant: true
- formula_id: shareholders_equity
  name: Shareholders' Equity
  description: Residual interest in assets after deducting liabilities.
  expression: TotalAssets - TotalLiabilities
  depends_on:
  - total_assets
  - total_liabilities
  data_type: Money
  category: BalanceSheet
  owner: Controller
  version: 1.0.0
  valid_from: '2026-01-01'
  tags:
  - gaap
  - balance_sheet
  - core
  source: formula_engine
  sox_relevant: true
- formula_id: burn_rate
  name: Burn Rate
  description: Rate at which a company consumes cash, typically monthly.
  expression: MonthlyCashOutflows - MonthlyCashInflows
  depends_on:
  - monthly_cash_outflows
  - monthly_cash_inflows
  data_type: Money
  category: CashFlow
  owner: Treasury
  version: 1.0.0
  valid_from: '2026-01-01'
  tags:
  - treasury
  - liquidity
  - startup
  source: manual
  sox_relevant: false
- formula_id: materiality_score
  name: Materiality Score
  description: Composite score indicating whether a variance exceeds defined thresholds of significance.
  expression: Computed from absolute and percentage thresholds
  depends_on:
  - variance_amount
  data_type: Ratio
  category: Variance
  owner: FP&A Team
  version: 1.0.0
  valid_from: '2026-01-01'
  tags:
  - variance
  - materiality
  - governance
  source: formula_engine
  sox_relevant: true
