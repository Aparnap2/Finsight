  sox_relevant: true
- formula_id: forecast_accuracy_mape
  name: Forecast Accuracy (MAPE)
  description: Measure of how closely the forecast matched actual results, expressed as Mean Absolute
    Percentage Error.
  expression: Mean(|Actual - Forecast| / |Actual|) * 100
  depends_on: []
  data_type: Percentage
  category: Budgeting
  owner: FP&A Team
  version: 1.0.0
  valid_from: '2026-01-01'
  tags:
  - forecasting
  - accuracy
  - kpi
  source: kpi_engine
  sox_relevant: true
- formula_id: variance_amount
  name: Variance Amount
  description: The absolute difference between actual results and the budget or forecast.
  expression: Actual - Budget
  depends_on: []
  data_type: Money
  category: Variance
  owner: FP&A Team
  version: 1.0.0
  valid_from: '2026-01-01'
  tags:
  - variance
  - core
  source: formula_engine
  sox_relevant: true
- formula_id: variance_pct
  name: Variance %
  description: The variance expressed as a percentage of budget.
  expression: (Actual - Budget) / ABS(Budget) * 100
  depends_on: []
  data_type: Percentage
  category: Variance
  owner: FP&A Team
  version: 1.0.0
  valid_from: '2026-01-01'
  tags:
  - variance
  - core
  source: formula_engine
  sox_relevant: true
- formula_id: volume_variance
  name: Volume Variance
  description: Portion of variance attributable to changes in quantity or volume.
  expression: (ActualVolume - BudgetVolume) * BudgetPrice
  depends_on: []
  data_type: Money
  category: Variance
  owner: FP&A Team
  version: 1.0.0
  valid_from: '2026-01-01'
  tags:
  - variance
  - driver_analysis
  source: formula_engine
  sox_relevant: true
- formula_id: price_variance
  name: Price Variance
  description: Portion of variance attributable to changes in price or rate.
  expression: (ActualPrice - BudgetPrice) * ActualVolume
  depends_on: []
  data_type: Money
  category: Variance
  owner: FP&A Team
  version: 1.0.0
  valid_from: '2026-01-01'
  tags:
  - variance
  - driver_analysis
  source: formula_engine
  sox_relevant: true
- formula_id: trend_score
  name: Trend Score
  description: Score indicating the direction and acceleration of a variance over consecutive periods.
  expression: Computed from multi-period trend analysis
  depends_on: []
  data_type: Ratio
  category: Variance
  owner: FP&A Team
  version: 1.0.0
  valid_from: '2026-01-01'
  tags:
  - variance
  - trend
  - analytics
  source: kpi_engine
  sox_relevant: false
- formula_id: net_revenue
  name: Net Revenue
  description: Total revenue from operations after deducting returns, allowances, and discounts.
  expression: GrossRevenue - Returns - Allowances - Discounts
  depends_on:
  - gross_revenue
  - returns
  - allowances
  - discounts
  data_type: Money
  category: Revenue
  owner: FP&A Team
  version: 1.0.0
  valid_from: '2026-01-01'
  tags:
  - gaap
  - p&l
  - core
  source: formula_engine
  sox_relevant: true
