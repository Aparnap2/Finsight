  - r_and_d
  - depreciation_amortization
  data_type: Money
  category: Expense
  owner: FP&A Team
  version: 1.0.0
  valid_from: '2026-01-01'
  tags:
  - gaap
  - p&l
  - core
  source: formula_engine
  sox_relevant: true
