[project]
name = "finsight"
version = "0.1.0"
description = "Agentic FP&A Operations Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic>=2.7.4,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.14.0,<2.0",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langchain-core>=1.4.9",
    "langchain-openai>=1.3.5",
    "langchain-qdrant>=0.2.0",
    "qdrant-client>=1.12.0,<2.0",
    "redis[hiredis]>=5.0,<6.0",
    "langfuse>=2.0,<3.0",
    "httpx>=0.27.0,<1.0",
    "python-dotenv>=1.0,<2.0",
    "psycopg[binary]>=3.1.0,<4.0",
    "psycopg-pool>=3.2.0,<4.0",
    "openai>=2.45.0",
    "litellm>=1.60.0,<2.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=6.0,<7.0",
    "ruff>=0.8.0,<1.0",
    "mypy>=2.0,<3.0",
    "httpx>=0.27.0,<1.0",
]
compute = [
    "polars>=1.0,<2.0",
    "duckdb>=1.0,<2.0",
    "pandera[polars]>=0.20,<1.0",
    "pyarrow>=17.0,<18.0",
    "openpyxl>=3.1,<4.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "llm: tests that call real LLM providers (requires API keys)",
    "integration: tests that require a real reachable Postgres (skipped otherwise)",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=0.26.0",
    "pytest-httpx>=0.35.0",
]
