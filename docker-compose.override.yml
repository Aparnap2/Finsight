# Docker Compose override for development.
# Hot-reloads python_runtime/ and tests/ directories and provides
# a convenience test command.
services:
  compute-runtime:
    volumes:
      - ./python_runtime:/app/python_runtime:ro
      - ./tests:/app/tests:ro
    command: >
      uvicorn apps.api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      - UVICORN_RELOAD=true
      - COMPUTE_RUNTIME_DEV=true

  # Convenience service for running tests inside the container
  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./python_runtime:/app/python_runtime:ro
      - ./tests:/app/tests:ro
    environment:
      - PYTHONPATH=/app
    command: >
      python -m pytest tests/test_python_runtime/ -v
    profiles:
      - test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
