name: CI (fast)

on:
  push:
  pull_request:

# Fail-fast: cancel superseded runs on the same ref; steps within the job
# also stop at the first failure (default GitHub behaviour).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: lint / typecheck / unit+contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Act-only venv workaround
        # `act` sets ACT=true and bind-mounts the repo; uv creating .venv on
        # the shared mount hangs on file locks. The act container is already
        # ephemeral, so system Python is safe there. Real GitHub runners
        # (ACT unset) keep the isolated .venv. Applies to every later `uv`
        # step via $GITHUB_ENV.
        run: |
          if [ "${ACT:-}" = "true" ]; then
            echo "UV_SYSTEM_PYTHON=1" >> "$GITHUB_ENV"
            echo "Local act run: using system Python (skip .venv)"
          fi

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies (frozen lockfile, all extras)
        run: uv sync --all-extras --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Secret leak gate (fail-closed, dependency-free)
        # scripts/secret_gate.py (stdlib only): exit 1 on any leak or
        # blocked filename, exit 2 on scan errors — never silently green.
        # Carve-outs are documented in the script: tests/ canaries,
        # repo-root .env (live store, owned by APA-79), .env.example.
        run: uv run python scripts/secret_gate.py .

      - name: Mypy (strict, report for ratchet gate)
        run: uv run mypy . > mypy-report.txt 2>&1 || true

      - name: Mypy report guard (fail-closed against crashes/truncation)
        # The || true above is intentional (raw mypy exits non-zero on the
        # recorded baseline); this guard ensures the report is complete so
        # the ratchet below can never pass vacuously on a missing marker.
        run: 'grep -qE "^(Found [0-9]+ error|Success: no issues found)" mypy-report.txt || (echo "mypy report missing/truncated" && exit 1)'

      - name: Mypy baseline ratchet (no new errors vs recorded baseline)
        run: uv run python scripts/mypy_baseline_check.py --baseline scripts/mypy-baseline.txt --report mypy-report.txt

      - name: Unit + contract tests
        env:
          # Accounting report: what was collected, what was executed, and why
          # anything was not.  Written by the plugin in tests/conftest.py.
          FINSIGHT_TEST_ACCOUNTING_REPORT: pytest-accounting.json
        run: |
          set -o pipefail
          uv run pytest tests/unit tests/contract tests/evaluation -q 2>&1 | tee pytest-unit.log

      - name: Completeness gate (fail green-but-incomplete runs)
        run: uv run python scripts/ci_gate.py pytest-unit.log --max-skips 5

      - name: Test accounting gate (collected vs executed must be explained)
        # A skipped test is not a passing test.  This gate fails the job when
        # the difference between what was collected and what was executed is
        # not covered by a declared reason, and when a file the manifest
        # expects was never collected at all.
        run: >
          uv run python scripts/test_accounting.py
          pytest-accounting.json
          --manifest docs/testing/test-accounting.json
          --job unit
          --summary pytest-accounting-summary.json

      - name: Upload unit logs and accounting
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-logs
          path: |
            pytest-unit.log
            pytest-accounting.json
            pytest-accounting-summary.json
          if-no-files-found: warn
