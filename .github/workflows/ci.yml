name: CI (fast)

on:
  push:
  pull_request:

# Fail-fast: cancel superseded runs on the same ref; steps within the job
# also stop at the first failure (default GitHub behaviour).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    name: lint / typecheck / unit+contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies (frozen lockfile, all extras)
        run: uv sync --all-extras --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict, per pyproject.toml)
        run: uv run mypy .

      - name: Unit + contract tests
        run: uv run pytest tests/unit tests/contract -q
