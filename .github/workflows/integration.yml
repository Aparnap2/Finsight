name: Integration

on:
  push:
  pull_request:
  workflow_dispatch:

# Fail-fast: cancel superseded runs on the same ref.
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: postgres-gated integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: finsight
          POSTGRES_USER: finsight
          POSTGRES_PASSWORD: finsight
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finsight"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      FINSIGHT_TEST_DSN: postgresql+psycopg://finsight:finsight@localhost:5432/finsight
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies (frozen lockfile, all extras)
        run: uv sync --all-extras --frozen

      - name: Wait for Postgres
        run: |
          python - <<'EOF'
          import socket
          import time

          for _attempt in range(30):
              try:
                  with socket.create_connection(("localhost", 5432), timeout=2):
                      print("postgres reachable")
                      break
              except OSError:
                  time.sleep(2)
          else:
              raise SystemExit("postgres not reachable after 60s")
          EOF

      # DB-gated skips are tolerated: suites skip when Postgres is
      # unreachable; -rs surfaces skip reasons and the summary line reports
      # passed / skipped / failed counts.
      - name: Run integration / failure / e2e suites
        run: |
          set -o pipefail
          uv run pytest tests/integration tests/failure tests/e2e -q -rs 2>&1 | tee pytest-integration.log

      - name: Report test counts
        if: always()
        run: |
          echo '=== integration suite summary ==='
          tail -n 15 pytest-integration.log || true
          echo '--- skip reasons ---'
          grep -E '^SKIPPED' pytest-integration.log | tail -n 20 || true

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-logs
          path: pytest-integration.log
          if-no-files-found: warn
